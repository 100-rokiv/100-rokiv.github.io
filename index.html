<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Винна мапа України</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;700&display=swap">
<style>
/* Layout: мапа — головний об'єкт; поруч (на телефоні нижче) одна картка вибраного вина, під ними список усіх вин. */
:root{
  /* Стиль сайту ресторану: теплий білий фон, темно-коричневий текст, великі літери з розрядкою */
  color-scheme:light;
  --bg:#FDFBF8; --surface:#F2EEE8; --ink:#43291B; --muted:#7B6659;
  --land:#F2EEE8; --land-on:#E3DACE; --edge:#43291B;
  --accent:#43291B; --on-accent:#FDFBF8; --gold:#A07A18; --line:#43291B;
  --display:"Jost","Century Gothic","Futura",system-ui,sans-serif;
  --body:"Jost","Century Gothic","Futura",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
h1 span{color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:56ch}
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}

.map{position:relative;width:100%;aspect-ratio:1000/670;max-width:100%;overflow:hidden;touch-action:pan-y;border-radius:12px}
.map.zoomed{touch-action:none;cursor:grab}
.inner{position:absolute;inset:0;transform-origin:0 0;transform:translate(var(--tx,0px),var(--ty,0px)) scale(var(--k,1))}
.inner.anim{transition:transform .35s ease}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px/1 var(--body);cursor:pointer}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map path,.map rect{fill:var(--land);stroke:var(--edge);stroke-width:1.1;stroke-linejoin:round;transition:fill .2s}
.map .has{fill:var(--land-on);cursor:pointer}
.map .sel{fill:var(--accent)}
.map circle.zone{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-opacity:.55;stroke-width:1.2;cursor:pointer;transition:fill-opacity .2s}
.map circle.zone.sel{fill-opacity:.45}
.map text{fill:var(--muted);font-family:var(--body);font-size:22px;text-anchor:middle;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%) scale(calc(1/var(--k,1)));display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:0;padding:6px;cursor:pointer;font:inherit;color:var(--ink)}
.pin i{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);
  box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
.pin span{font-size:12px;font-weight:600;line-height:1.2;background:var(--surface);padding:2px 7px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.pin[aria-pressed="true"] i{background:var(--surface);border-color:var(--ink);animation:none}
.pin[aria-pressed="true"] span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pin:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.pin i{animation:none}.map path,.map rect{transition:none}.inner.anim,.card{transition:none!important}}

.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.close{display:none}
.shade{display:none}
@media (max-width:820px){
  .card{position:fixed;left:0;right:0;bottom:0;z-index:10;border-radius:18px 18px 0 0;max-height:82vh;max-height:82dvh;overflow:auto;
    transform:translateY(calc(100% + 60px));transition:transform .3s ease;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.28)}
  .card.open{transform:none}
  .close{display:block;position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 18px/1 var(--body);cursor:pointer}
  .shade.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:9}
}
.photo{display:flex;align-items:center;gap:16px}
.photo svg{width:64px;height:150px;flex:none}
.photo .cap{font-size:12px;color:var(--muted);margin:0}
.region{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0}
.card h2{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.wine{margin:4px 0 0;font-weight:600}
.desc{margin:0}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:14px;border-top:1px solid var(--line);padding-top:16px}
dt{color:var(--muted)} dd{margin:0}

h3{font-family:var(--display);font-weight:500;font-size:16px;margin:0}
.list{display:flex;flex-direction:column;gap:12px}
.rows{display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;cursor:pointer;font:inherit;color:var(--ink)}
.row b{font-weight:600}
.row small{color:var(--muted);font-size:14px}
.row em{font-style:normal;color:var(--muted);font-size:14px;grid-row:1/3;grid-column:2;align-self:center}
.row[aria-current="true"] b{color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0;max-width:70ch}

/* — фірмовий стиль 100 років тому вперед — */
body{font-size:15px;line-height:1.6}
header{align-items:center;text-align:center;gap:14px;padding-block:12px 4px}
.eyebrow{font-size:13px;letter-spacing:.2em}
h1{font-size:clamp(22px,5vw,28px);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
h1 span{color:inherit}
.lede{font-size:13px;text-transform:uppercase;letter-spacing:.16em;line-height:1.8;max-width:52ch}
.map path,.map rect{stroke-width:.9}
.pin i{border:2px solid var(--bg)}
.pin span{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;border-radius:0;border:0;background:var(--bg);padding:3px 7px}
.pin[aria-pressed="true"] i{background:var(--bg);border-color:var(--ink)}
.zoom button{border-radius:0;border:1px solid var(--ink);background:var(--bg);font-weight:300}
.card{border:0;border-radius:0;padding:24px}
.region{letter-spacing:.2em;font-weight:500;color:var(--muted)}
.card h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.wine{text-transform:uppercase;letter-spacing:.16em;font-weight:400;font-size:14px}
.photo .cap{text-transform:uppercase;letter-spacing:.14em;font-size:11px}
dl{font-size:13px;border-top:1px solid var(--line)}
dt{text-transform:uppercase;letter-spacing:.16em;font-size:11px;align-self:center}
h3{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;text-align:center}
.rows{border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);padding:16px 2px}
.row b{font-weight:500;text-transform:uppercase;letter-spacing:.12em;font-size:14px}
.row small,.row em{font-size:12px;text-transform:uppercase;letter-spacing:.14em}
.row[aria-current="true"] b{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.note{font-size:12px;text-align:center;margin-inline:auto}
/* точка стоїть рівно на координаті, підпис під нею або над нею */
.pin{display:block;padding:6px}
.pin i{display:block}
.pin span{position:absolute;left:50%;top:calc(100% - 3px);transform:translateX(-50%)}
.pin.up span{top:auto;bottom:calc(100% - 3px)}
.pin.side span{left:calc(100% - 3px);top:50%;transform:translateY(-50%)}
@media (max-width:820px){.card{border-radius:0}.close{border-radius:0;border:1px solid var(--ink)}}

/* — картка виноробні та винна карта — */
.pin{padding:4px}
.pin i{width:13px;height:13px}
.pin span{display:none}
.map.labels .pin span,.pin[aria-pressed="true"] span{display:block}
.pin[aria-pressed="true"]{z-index:3}
.factbox{display:flex;flex-direction:column;gap:4px}
.cap{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.fact{margin:0;font-size:15px;line-height:1.55}
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 22%,transparent)}
.wl svg{width:14px;height:34px;grid-row:1/3;grid-column:1}
.wl .t{grid-column:2;grid-row:1;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.wl .n{grid-column:2;grid-row:2;font-weight:500;letter-spacing:.04em;overflow-wrap:anywhere}
.wl .p{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows{border-top:0}
.rg{margin:28px 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;text-align:center}
.rows .row{border-bottom:0;border-top:1px solid var(--line);padding:14px 2px 10px;margin-top:6px}
.rows .wl{border-top:0}
.row em{grid-row:auto;text-decoration:underline;text-underline-offset:4px}
.row[aria-current="true"] b{text-decoration:none}

/* — перемикач мови — */
header{position:relative}
.langs{align-self:flex-end;display:flex;gap:2px;border:1px solid var(--ink)}
.langs button{font:500 12px/1 var(--body);letter-spacing:.16em;padding:8px 12px;border:0;background:var(--bg);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

</head>

</div>

// Крайні точки України: за ними географічні координати переводяться в координати мапи
const GEO = {w:22.14, e:40.23, n:52.38, s:44.39};
const merc = d => Math.log(Math.tan(Math.PI/4 + d*Math.PI/360));
function project(lon, lat){
  const b = svg.getBBox();
  return [b.x + (lon - GEO.w) / (GEO.e - GEO.w) * b.width,
          b.y + (merc(GEO.n) - merc(lat)) / (merc(GEO.n) - merc(GEO.s)) * b.height];
}
const inner = document.getElementById('inner'), shade = document.getElementById('shade');
const narrow = () => matchMedia('(max-width:820px)').matches;

// Власний масштаб мапи: щипок двома пальцями, перетягування, кнопки +/−
let k = 1, tx = 0, ty = 0, dragged = false;
const pts = new Map(); let prev = null;
function apply(anim){
  const r = mapEl.getBoundingClientRect();
  k = Math.min(8, Math.max(1, k));
  tx = Math.min(0, Math.max(r.width * (1 - k), tx));
  ty = Math.min(0, Math.max(r.height * (1 - k), ty));
  inner.classList.toggle('anim', !!anim);
  inner.style.setProperty('--k', k); inner.style.setProperty('--tx', tx + 'px'); inner.style.setProperty('--ty', ty + 'px');
  mapEl.classList.toggle('zoomed', k > 1.01);
  mapEl.classList.toggle('labels', k >= (narrow() ? 2.2 : 1));
}
function zoomAt(x, y, nk, anim){
  nk = Math.min(8, Math.max(1, nk));
  tx = x - (x - tx) * nk / k; ty = y - (y - ty) * nk / k; k = nk; apply(anim);
}
function resetZoom(){ k = 1; tx = 0; ty = 0; apply(true); }
function gesture(){
  const r = mapEl.getBoundingClientRect(), a = [...pts.values()];
  if(a.length >= 2) return {x:(a[0].x + a[1].x)/2 - r.left, y:(a[0].y + a[1].y)/2 - r.top, d:Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)};
  return {x:a[0].x - r.left, y:a[0].y - r.top, d:0};
}
mapEl.addEventListener('pointerdown', e => {
  if(e.target.closest('.zoom')) return;
  if(!pts.size) dragged = false;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY}); prev = gesture();
});
addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if(!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if(Math.hypot(p.x - p.sx, p.y - p.sy) > 8) dragged = true;
  const g = gesture();
  if(pts.size >= 2 && prev && prev.d){ tx += g.x - prev.x; ty += g.y - prev.y; zoomAt(g.x, g.y, k * g.d / prev.d); dragged = true; }
  else if(pts.size === 1 && k > 1.01 && prev){ tx += g.x - prev.x; ty += g.y - prev.y; apply(); }
  prev = g;
});
const drop = e => { if(pts.delete(e.pointerId)) prev = pts.size ? gesture() : null; };
addEventListener('pointerup', drop); addEventListener('pointercancel', drop);
const center = () => { const r = mapEl.getBoundingClientRect(); return [r.width/2, r.height/2]; };
document.getElementById('zin').addEventListener('click', () => zoomAt(...center(), k * 1.6, true));
document.getElementById('zout').addEventListener('click', () => zoomAt(...center(), k / 1.6, true));

async function loadShapes(){
  const timeout = new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 7000));
  const mod = await Promise.race([import('https://cdn.jsdelivr.net/npm/@svg-maps/ukraine@2.0.0/index.js'), timeout]);
  const m = mod.default;
  if(!m || !m.locations || !m.locations.length) throw new Error('empty');
  return m;
}

function drawReal(m){
  svg.setAttribute('viewBox', m.viewBox);
  for(const l of m.locations){
    const p = document.createElementNS(NS,'path');
    p.setAttribute('d', l.path);
    p.dataset.key = (l.id + ' ' + l.name).toLowerCase(); p.dataset.en = l.name;
    svg.append(p);
  }
}
function drawTiles(){
  const W = 104, H = 118, ox = 32, oy = 40;
  for(const [k,[c,r]] of Object.entries(TILES)){
    const g = document.createElementNS(NS,'rect');
    g.setAttribute('x', ox + c*W); g.setAttribute('y', oy + r*H);
    g.setAttribute('width', W); g.setAttribute('height', H); g.setAttribute('rx', 14);
    g.dataset.key = k; svg.append(g);
  }
}

function bottle(type){
  return `<svg viewBox="0 0 28 68" aria-hidden="true"><path d="M11 2h6v15c0 4 6 6 6 13v32a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V30c0-7 6-9 6-13z" fill="${TONE[type] || '#DDD'}" stroke="var(--ink)" stroke-width="1.6"/></svg>`;
}

const wineList = ws => `<ul class="wl">${ws.map(w => `<li>${bottle(w.t)}<span class="t">${typeName(w.t)}</span><span class="n">${tr(w,'n')}</span><span class="p">${price(w)}</span></li>`).join('')}</ul>`;

function select(id, scroll){
  const w = WINERIES.find(x => x.id === id); if(!w) return;
  current = id;
  card.innerHTML = `
    <button class="close" type="button" aria-label="${t('close')}">✕</button>

  if(scroll){ resetZoom(); if(narrow()){ card.scrollTop = 0; card.classList.add('open'); shade.classList.add('on'); } }
}

function wire(){
  const vb = svg.viewBox.baseVal;
  svg.querySelectorAll('[data-key]').forEach(el => {
    el.append(document.createElementNS(NS,'title'));
  });
  const seen = {};
  for(const w of WINERIES){
    const el = [...svg.querySelectorAll('[data-key]')].find(e => w.re.test(e.dataset.key));
    if(!el) continue;
    const b = el.getBBox(), n = seen[w.region] = (seen[w.region] || 0) + 1;
    const [px, py] = realMap ? project(w.lon, w.lat) : [b.x + b.width/2, b.y + b.height * n / 4];
    let zone = el;
    if(realMap){ // невелика зона довкола виноробні замість усієї області
      zone = document.createElementNS(NS,'circle');
      zone.setAttribute('cx', px); zone.setAttribute('cy', py); zone.setAttribute('r', 11);
      zone.classList.add('zone'); svg.append(zone);
      zone.dataset.wine = w.id;
      zone.addEventListener('click', () => { if(!dragged) select(w.id, true); });
    } else el.classList.add('has');
    const pin = document.createElement('button');
    pin.className = 'pin' + (w.pos ? ' ' + w.pos : ''); pin.type = 'button'; pin.dataset.id = w.id;
    pin.style.left = ((px - vb.x) / vb.width * 100) + '%';
    pin.style.top = ((py - vb.y) / vb.height * 100) + '%';
    pin.innerHTML = `<i></i><span></span>`;
    pin.addEventListener('click', () => { if(!dragged) select(w.id, true); });
    inner.append(pin);
  }
  rows.addEventListener('click', e => { const b = e.target.closest('.row'); if(b) focusOn(b.dataset.id); });
  renderLang();
  apply();
}

// «На мапі»: прокрутити до мапи, наблизити її до виноробні й виділити точку
function focusOn(id){
  select(id, false);
  mapEl.scrollIntoView({behavior:'smooth', block:'center'});
  const pin = mapEl.querySelector(`.pin[data-id="${id}"]`); if(!pin) return;
  const r = mapEl.getBoundingClientRect();
  const x = parseFloat(pin.style.left) / 100 * r.width, y = parseFloat(pin.style.top) / 100 * r.height;
  const nk = narrow() ? 3.2 : 2.2;
  k = nk; tx = r.width / 2 - x * nk; ty = r.height / 2 - y * nk; apply(true);
}

  svg.querySelectorAll('[data-key] > title').forEach(ti => { const el = ti.parentNode; ti.textContent = lang === 'en' && el.dataset.en ? el.dataset.en : uaName(el.dataset.key); });
  mapEl.querySelectorAll('.pin').forEach(p => { const w = WINERIES.find(x => x.id === p.dataset.id); p.querySelector('span').textContent = tr(w,'name'); });

      `<button class="row" type="button" data-id="${w.id}"><b>${tr(w,'name')}</b><em>${t('onmap')}</em></button>${wineList(w.wines)}`).join('')).join('')

  select(current || WINERIES[0].id, false);
  if(open) card.classList.add('open');
}
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch(e) {}
  renderLang();
}));

try { drawReal(await loadShapes()); realMap = true; }
catch(e){ svg.replaceChildren(); drawTiles(); }
wire();
</script>
</body>
</html>
